<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>GhostRP Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#070b14;
--panel:#0e1629;
--border:#1c2e55;
--blue:#2f5fd1;
--text:#e2eaff;
--muted:#8fa2c9
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Inter",sans-serif
}

body{
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(900px 500px at 50% -200px,#10224d,transparent),
url("assets/tło.png") center/cover no-repeat;
color:var(--text);
overflow:hidden;
position:relative
}

body::before{
content:"";
position:absolute;
inset:0;
background:rgba(5,8,15,.92);
z-index:0
}

.splash{
width:420px;
padding:42px 42px;
background:linear-gradient(180deg,#0e1629,#111c33);
border-radius:28px;
border:1px solid var(--border);
display:flex;
flex-direction:column;
align-items:center;
gap:22px;
z-index:1;
animation:fadeIn .8s ease forwards;
transition:opacity .4s ease,transform .4s ease;
box-shadow:0 30px 70px rgba(0,0,0,.65)
}

.logo{
width:96px;
height:96px;
border-radius:18px;
background:#000;
box-shadow:0 0 0 1px var(--border)
}

.title{
font-size:22px;
font-weight:700;
letter-spacing:.6px
}

.subtitle{
font-size:14px;
color:var(--muted);
letter-spacing:.3px
}

.loader{
display:flex;
gap:10px;
margin-top:8px
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--blue);
opacity:.25;
animation:dot 1.4s infinite ease-in-out
}

.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px) scale(.98)}
to{opacity:1;transform:none}
}

@keyframes dot{
0%,100%{opacity:.2;transform:translateY(0)}
40%{opacity:1;transform:translateY(-6px)}
}
</style>
</head>
<body>

<div class="splash" id="splash">
<img src="/img/Discord-Logo.png" class="logo">
<div class="title">GhostRolePlay</div>
<div class="subtitle">Uruchamianie launchera</div>
<div class="loader">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>
</div>

<script>
const splash=document.getElementById("splash");

setTimeout(()=>{
splash.style.opacity=0;
splash.style.transform="scale(.97)";
setTimeout(()=>{
window.location.href="fivem://connect/ghostrp.eu";
},400);
},1800);
</script>

</body>
</html>
